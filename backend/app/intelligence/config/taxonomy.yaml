# KAAMSETU fault taxonomy (configurable).
#
# Each symptom is detected from keywords in the transcript. It never infers a diagnosis.
#   any:          the symptom needs at least one of these keywords in a clause
#   with_any:     (optional) ...and at least one of these in the SAME clause
#   suppressed_by:(optional) drop this symptom if any of the listed symptoms was found
#   negation_ok:  the symptom's meaning already contains a negation ("power nahi hai"), so skip negation checks
#   safety:       an explicit report of this symptom sets safety_concern
#   specific:     strongly indicates its category (weight 2) vs generic (weight 1) in classification
#   severity:     low | medium | high, used by priority rules
#
# Keyword syntax: matched per whitespace token after normalisation (lower-case, nukta and punctuation removed).
#   "vibrat"   - stem: matches vibration, vibrating ...   (last token of a phrase is a stem)
#   "=aag"     - exact token only (so "aag" does not match "aage")
#   "power cut"- phrase: tokens must be consecutive

version: 1

categories:
  mechanical:      {en: Mechanical, hi: यांत्रिक, te: యాంత్రిక}
  electrical:      {en: Electrical, hi: विद्युत, te: విద్యుత్}
  instrumentation: {en: Instrumentation, hi: इंस्ट्रूमेंटेशन, te: ఇన్స్ట్రుమెంటేషన్}
  hydraulic:       {en: Hydraulic, hi: हाइड्रोलिक, te: హైడ్రాలిక్}
  pneumatic:       {en: Pneumatic, hi: न्यूमेटिक, te: న్యూమాటిక్}
  production:      {en: Production, hi: उत्पादन, te: ఉత్పత్తి}
  other:           {en: Other, hi: अन्य, te: ఇతర}

