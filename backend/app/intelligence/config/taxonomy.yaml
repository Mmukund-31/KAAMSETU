# Production impact. Patterns are regular expressions over normalised clause text.
# A clause must also mention a subject (production, line, machine ...) unless the question asked was
# about production, in which case short answers like "haan, chal raha hai" are accepted.
# Within a clause, precedence is stopped > degraded > running. Across clauses, the LAST mention wins
# ("pehle ruk gaya tha, ab chal raha hai" -> running).
production_impact:
  # Machine types count as subjects too: "the boiler is still running" is about production at that machine.
  subjects: [production, =line, machine, motor, plant, output, boiler, compressor, =pump, conveyor, =press, उत्पादन, प्रोडक्शन, लाइन, मशीन, मोटर, प्लांट, बॉयलर, कंप्रेसर, पंप, ప్రొడక్షన్, ఉత్పత్తి, లైన్, మెషిన్, మోటార్, ప్లాంట్, బాయిలర్, కంప్రెసర్, పంప్]
  stopped:
    - '\bstop'
    - '\bhalt'
    - '\bshut ?down'
    - '\bbreak ?down'
    - '\bnot (running|working)'
    - '\bisnt running'
    - '\b(nahi|nahin|nhi|na) chal'
    - '\bchalu (nahi|nahin|nhi)'
    - '\bband (ho|hai|pad|kar|he)'
    - '\bruk (gaya|gayi|gai|gya|gyi|chuka|chuki|gaye)'
    - '\bruk(a|i|e) (hua|hui|hue|hai|he|pada|padi)'
    - '\bdown hai'
    - 'रुक गय|रुक गई|रुक चुक|रुका|बंद|ठप|नहीं चल|चालू नहीं'
    - 'ఆగిపో|ఆగింది|ఆగి ఉంది|నిలిచిపో|నడవడం లేదు|నడవటం లేదు|నడవట్లేదు|నడవడంలేదు|బంద్|ఆపేశ'
  degraded:
    - '\bslow'
    - '\breduced'
    - '\bdh(ee|i)r'
    - '\bdh(ee|i)m'
    - '\b(kam|less|low) (output|speed|production)'
    - '\b(output|speed|production) (kam|less|low|reduced)'
    # "not affected" means running; the lookbehinds stop it counting as degraded.
    - '(?<!not )(?<!isnt )(?<!wasnt )\b(affected|impacted)'
    - 'धीम|धीरे|स्पीड कम|उत्पादन कम|प्रोडक्शन कम|कम उत्पादन|प्रभावित(?! नहीं)'
    - 'నెమ్మది|స్పీడ్ తక్కువ|తక్కువ ప్రొడక్షన్|ప్రొడక్షన్ తక్కువ|ప్రభావిత'
  running:
    - '\brunning'
    - '\bchal (raha|rahi|rha|rhi|rahe|rhe)'
    - '\bchalu (hai|he)\b'
    - '\b(still|is) (running|working|on)\b'
    - '\bon hai\b'
    - '\bnot (affected|impacted)|\bunaffected'
    - 'चल रह|चालू है|चालू|प्रभावित नहीं'
    - 'నడుస్తో|నడుస్తు|నడుస్తున్న|రన్ అవుతో|రన్నింగ్|జరుగుతో'

# Optional free-text location ("Bay 2", "Line A"). The registered equipment location is always shown too.
# The id must not be the start of an equipment code: "line L-701" is not location "Line L".
location_pattern: '\b(bay|line|cell|hall|shop|section|area|zone|floor|panel|room|unit)\s+(?:no\s+|number\s+)?(\d{1,3}\b|[a-z]\b(?!\s*\d))'
