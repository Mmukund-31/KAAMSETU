services:
  db:
    image: postgres:16-alpine
    container_name: kaamsetu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaamsetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaamsetu}
      POSTGRES_DB: ${POSTGRES_DB:-kaamsetu}
    ports:
      # Host port 5433: a native PostgreSQL 17 service already uses 5432 on the dev machine.
      - "${KAAMSETU_DB_HOST_PORT:-5433}:5432"
    volumes:
      - kaamsetu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaamsetu} -d ${POSTGRES_DB:-kaamsetu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: kaamsetu-backend
    restart: unless-stopped
    env_file:
      # Optional so `docker compose up db` works before backend/.env is created.
      - path: ./backend/.env
        required: false
    environment:
      # Inside the compose network the DB host is the service name, not localhost.
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-kaamsetu}:${POSTGRES_PASSWORD:-kaamsetu}@db:5432/${POSTGRES_DB:-kaamsetu}
    ports:
      # Host port 8001: another local project (RUKO) already serves on 8000.
      - "${KAAMSETU_API_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    # Supervisor console, built and served by nginx; /api is forwarded to the backend on the compose network.
    build:
      context: ./supervisor-web
    container_name: kaamsetu-web
    restart: unless-stopped
    ports:
      - "${KAAMSETU_WEB_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kaamsetu_pgdata:
