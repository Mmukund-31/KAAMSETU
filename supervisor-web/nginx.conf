# Supervisor console. The console and the API share one origin, so no CORS setup is needed.
# Note: nginx drops server-level add_header lines in any location that sets its own, so the security
# headers are repeated in each location.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same limit as the backend (MAX_AUDIO_UPLOAD_MB + 1); also caps chunked bodies the app cannot measure.
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Single-page app: unknown paths are routes in the console.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }
}
